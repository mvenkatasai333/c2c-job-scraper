name: C2C Job Scraper

on:
  schedule:
    # All times in UTC. EST = UTC-5 (Nov–Mar), EDT = UTC-4 (Mar–Nov)
    # Using EDT (summer): 10am=14:00, 1pm=17:00, 4pm=20:00 UTC
    # Using EST (winter): 10am=15:00, 1pm=18:00, 4pm=21:00 UTC
    # Running BOTH so it works year-round automatically:
    - cron: '0 14 * * 1-5'   # 10:00 AM EDT (summer Mon-Fri)
    - cron: '0 15 * * 1-5'   # 10:00 AM EST (winter Mon-Fri)
    - cron: '0 17 * * 1-5'   #  1:00 PM EDT (summer Mon-Fri)
    - cron: '0 18 * * 1-5'   #  1:00 PM EST (winter Mon-Fri)
    - cron: '0 20 * * 1-5'   #  4:00 PM EDT (summer Mon-Fri)
    - cron: '0 21 * * 1-5'   #  4:00 PM EST (winter Mon-Fri)
  workflow_dispatch:           # manual trigger anytime

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── Dedup cache: persists seen_jobs.json across ALL runs ──────────────
      - name: Restore dedup cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: seen_jobs.json
          key: seen-jobs-cache
          restore-keys: seen-jobs-cache

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt --break-system-packages
          playwright install chromium
          playwright install-deps chromium

      - name: Run scraper
        env:
          EMAIL_SENDER:   ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: python scraper.py

      # ── Always save updated seen_jobs.json back to cache ──────────────────
      - name: Save dedup cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: seen_jobs.json
          key: seen-jobs-cache

      # ── Upload Excel as email backup inside GitHub too ─────────────────────
      - name: Upload Excel artifact (backup in GitHub)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c2c-jobs-${{ github.run_number }}-${{ github.run_attempt }}
          path: c2c_data_jobs.xlsx
          retention-days: 14
          if-no-files-found: ignore
